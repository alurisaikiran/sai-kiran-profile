<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <rect width="320" height="160" fill="#0d1b2a"/>
  <!-- Circuit grid lines -->
  <line x1="0" y1="40" x2="320" y2="40" stroke="#1a3a5c" stroke-width="0.5"/>
  <line x1="0" y1="120" x2="320" y2="120" stroke="#1a3a5c" stroke-width="0.5"/>
  <!-- SC badge -->
  <rect x="18" y="38" width="56" height="56" rx="4" fill="#0057a8"/>
  <text x="23" y="80" font-family="Arial Black, sans-serif" font-size="30" font-weight="900" fill="#fff">SC</text>
  <rect x="18" y="88" width="56" height="8" fill="#00a8e0"/>
  <!-- Year badge -->
  <rect x="60" y="86" width="30" height="12" rx="2" fill="#00a8e0"/>
  <text x="64" y="96" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#fff">2024</text>
  <!-- Text -->
  <text x="90" y="62" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="#fff" letter-spacing="1">SC24</text>
  <text x="90" y="78" font-family="Arial, sans-serif" font-size="9" fill="#00a8e0" letter-spacing="2">SUPERCOMPUTING</text>
  <line x1="90" y1="86" x2="290" y2="86" stroke="#0057a8" stroke-width="1"/>
  <text x="90" y="100" font-family="Arial, sans-serif" font-size="8" fill="#5a8ab0" letter-spacing="1">THE INTERNATIONAL CONFERENCE</text>
