  <line x1="88" y1="76" x2="288" y2="76" stroke="#c8a96e" stroke-width="1"/>
  <text x="88" y="92" font-family="Arial, sans-serif" font-size="9" fill="#888" letter-spacing="3">AESTHETICS</text>
