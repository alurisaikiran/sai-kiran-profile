  <text x="100" y="76" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#5a1e2a" letter-spacing="2">ÉLAN</text>
  <line x1="100" y1="84" x2="292" y2="84" stroke="#c9a84c" stroke-width="1.5"/>
