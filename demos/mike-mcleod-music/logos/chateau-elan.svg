  <rect x="32" y="64" width="48" height="42" fill="#5a1e2a"/>
  <polygon points="56,30 32,64 80,64" fill="#5a1e2a"/>
  <!-- Side tower -->
  <rect x="24" y="48" width="14" height="58" fill="#6a2a35"/>
  <polygon points="31,34 24,48 38,48" fill="#6a2a35"/>
