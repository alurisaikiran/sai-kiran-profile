<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <rect width="320" height="160" fill="#fff"/>
  <!-- Manor house silhouette -->
  <rect x="28" y="62" width="52" height="44" fill="#3a3020"/>
  <polygon points="54,36 28,62 80,62" fill="#3a3020"/>
  <!-- Tower left -->
  <rect x="24" y="50" width="12" height="56" fill="#4a4030"/>
  <polygon points="30,38 24,50 36,50" fill="#4a4030"/>
  <!-- Tower right -->
  <rect x="72" y="54" width="12" height="52" fill="#4a4030"/>
  <polygon points="78,42 72,54 84,54" fill="#4a4030"/>
  <!-- Windows -->
  <rect x="38" y="74" width="10" height="12" fill="#c9a84c" opacity="0.7"/>
  <rect x="60" y="74" width="10" height="12" fill="#c9a84c" opacity="0.7"/>
  <rect x="48" y="86" width="12" height="20" fill="#3a3020"/>
  <!-- Text -->
  <text x="104" y="60" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#3a3020" letter-spacing="2">BARNSLEY</text>
  <text x="104" y="78" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#c9a84c" letter-spacing="2">RESORT</text>
  <line x1="104" y1="86" x2="292" y2="86" stroke="#c9a84c" stroke-width="1"/>
  <text x="104" y="100" font-family="Arial, sans-serif" font-size="8" fill="#aaa" letter-spacing="2">ADAIRSVILLE · GEORGIA</text>
</svg>
