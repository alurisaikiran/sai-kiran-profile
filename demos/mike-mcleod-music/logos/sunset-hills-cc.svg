<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <rect width="320" height="160" fill="#fff"/>
  <!-- Sun setting behind hills -->
  <circle cx="52" cy="84" r="20" fill="#f4a020" opacity="0.9"/>
  <!-- Hills -->
  <ellipse cx="36" cy="106" rx="24" ry="16" fill="#2a6a2a"/>
  <ellipse cx="68" cy="110" rx="20" ry="14" fill="#3a8a3a"/>
  <ellipse cx="52" cy="112" rx="18" ry="12" fill="#1a5a1a"/>
  <!-- Sun rays -->
  <line x1="52" y1="58" x2="52" y2="52" stroke="#f4a020" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68" y1="62" x2="72" y2="56" stroke="#f4a020" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="62" x2="32" y2="56" stroke="#f4a020" stroke-width="2" stroke-linecap="round"/>
  <!-- Golf flag -->
  <rect x="50" y="60" width="2" height="24" fill="#8b6a3a"/>
  <polygon points="52,60 52,70 62,65" fill="#c8102e"/>
  <!-- Text -->
  <text x="98" y="60" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#1a4a1a" letter-spacing="1">SUNSET HILLS</text>
  <line x1="98" y1="68" x2="290" y2="68" stroke="#f4a020" stroke-width="1.5"/>
  <text x="98" y="84" font-family="Georgia, serif" font-size="10" fill="#2a6a2a" letter-spacing="3">COUNTRY CLUB</text>
  <text x="98" y="100" font-family="Arial, sans-serif" font-size="8" fill="#aaa" letter-spacing="2">GEORGIA</text>
</svg>
